<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jobee Flow — Hors ligne</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafafa;
        color: #1a1a2e;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #17181f;
          color: #f3f4f8;
        }
      }
      .card {
        max-width: 26rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin-bottom: 0.5rem;
      }
      p {
        font-size: 0.95rem;
        opacity: 0.8;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.6rem 1.2rem;
        border-radius: 0.5rem;
        background: #2f4f9e;
        color: white;
        text-decoration: none;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Vous êtes hors ligne</h1>
      <p>
        Jobee Flow continue de fonctionner avec vos données locales. Cette page précise n'a pas
        encore été mise en cache pour un usage hors ligne — réessayez une fois reconnecté, ou
        retournez à une page déjà visitée.
      </p>
      <a href="/">Retour à l'accueil</a>
    </div>
  </body>
</html>
